apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gateway-options.yaml
  - gateway.yaml
  - envoyfilter.yaml
  - demo-backend.yaml

configMapGenerator:
  - name: coraza-waf-demo-rules
    files:
      - demo-rules.conf

generatorOptions:
  disableNameSuffixHash: true
